<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 8px; color: #ddd; background: transparent; font-size: 12px; }
  #status { color: #9aa; margin-bottom: 6px; min-height: 16px; }
  #wrap { position: relative; width: 100%; }
  #sheet { width: 100%; display: block; border-radius: 4px; }
  #labels { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); pointer-events: none; }
  #labels span { font-size: 10px; color: #cfd6dc; padding: 3px 5px; }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .swatch { width: 22px; height: 22px; border-radius: 3px; border: 1px solid #555; }
  input.hex { width: 74px; }
  label { min-width: 52px; }
  .hint { color: #7f8a92; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
  <div id="status">Open a part's .psd from art\work</div>
  <div id="wrap">
    <img id="sheet" />
    <div id="labels">
      <span>Iso (front)</span><span>Front</span><span>Back</span><span>Top</span>
      <span>Iso (back)</span><span>Left</span><span>Right</span><span>Bottom</span>
    </div>
  </div>
  <div id="controls">
    <div class="row">
      <label>Look</label>
      <select id="look">
        <option value="FLAT">Flat (as painted)</option>
        <option value="LIT">Lit (game-like)</option>
        <option value="GHOST">Ghostly (Spirit FX)</option>
        <option value="DUSK">Croatoa dusk</option>
      </select>
    </div>
    <div class="row">
      <label>Color1</label><div class="swatch" id="sw1"></div>
      <input class="hex" id="c1" />
      <button id="fg1">Use foreground</button>
    </div>
    <div class="row">
      <label>Color2</label><div class="swatch" id="sw2"></div>
      <input class="hex" id="c2" />
      <button id="fg2">Use foreground</button>
    </div>
    <div class="hint">Mask black = Color1, white = Color2. The views re-render in 3ds Max each time you save (Ctrl+S). Keep the CoH Art Bridge running.</div>
  </div>
  <script src="index.js"></script>
</body>
</html>
